name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same ref on new push; keep deploys sequential.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Backend: Lint + Format (Ruff) ──────────────────────────────────────
  backend-lint:
    name: "Backend · Ruff (lint + format)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install "ruff==0.5.0"

      - name: Lint
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format --check .

  # ── 2. Backend: Type Check (Mypy) ─────────────────────────────────────────
  backend-typecheck:
    name: "Backend · Mypy"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps + Mypy
        run: |
          pip install -r requirements.txt
          pip install "mypy==1.11.0"

      # Strict check on modules that do not trigger SQLAlchemy 1.x Column[...] false positives
      - name: Type-check clean modules
        run: >-
          mypy --follow-imports=silent
          auth.py constants.py database.py events.py main.py media.py
          migrate.py models.py schemas.py validation.py routers/contacts.py tests

      # Full project report (advisory until models.py migrates to SQLAlchemy 2.0 Mapped[])
      - name: Full project type-check report (advisory)
        continue-on-error: true
        run: |
          {
            echo "### Mypy full-project report (advisory)"
            echo '```'
            mypy . || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mypy .

  # ── 3. Backend: Tests + Schema + Boot Verification ────────────────────────
  backend-test:
    name: "Backend · Pytest + Postgres"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: messenger_test
          POSTGRES_USER: messenger_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_NAME: messenger_test
      DB_USER: messenger_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
      SECRET_KEY: "ci-only-test-secret-not-for-production"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps + test tools
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Initialize schema from init.sql
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg2

          sql = Path("init.sql").read_text(encoding="utf-8")
          with psycopg2.connect(
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
                  cur.execute(
                      "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename"
                  )
                  tables = [row[0] for row in cur.fetchall()]
          print("Initialized tables:", tables)
          expected = {
              "account_deletion_jobs",
              "chat_members",
              "chats",
              "contacts",
              "messages",
              "schema_migrations",
              "users",
          }
          missing = expected - set(tables)
          assert not missing, f"Missing tables from init.sql: {missing}"
          PY

      - name: Run unit tests
        working-directory: backend
        run: pytest -v --tb=short

      - name: Boot verification & Postgres integration tests
        working-directory: backend
        env:
          MESSENGER_TEST_RUN_INTEGRATION: "1"
          MESSENGER_TEST_BASE: "http://127.0.0.1:8000"
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          trap 'kill "$UVICORN_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            health=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health 2>/dev/null || true)
            page=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ 2>/dev/null || true)
            if [ "$health" = "200" ] && [ "$page" = "200" ]; then
              echo "Server boot verified: /api/health=200, /=200"
              break
            fi
            sleep 1
          done

          if [ "${health:-}" != "200" ] || [ "${page:-}" != "200" ]; then
            echo "Server failed to boot (health=${health:-}, page=${page:-})" >&2
            exit 1
          fi

          pytest tests/test_account_delete.py -v --tb=short

  # ── 4. Backend: Dependency Security Audit ─────────────────────────────────
  backend-audit:
    name: "Backend · pip-audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run pip-audit
        run: |
          pip install "pip-audit==2.7.3"
          # Upstream python-jose (PYSEC-2026-4298) and ecdsa (PYSEC-2026-1325)
          # currently have no patched release; ignore only these two documented
          # advisories so any newly introduced CVE still fails CI.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2026-1325

  # ── 5. Frontend: Lint (ESLint + Stylelint + HTMLHint) ─────────────────────
  frontend-lint:
    name: "Frontend · ESLint + Stylelint + HTMLHint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dev deps
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Stylelint
        run: npx stylelint "**/*.css" --allow-empty-input

      - name: HTMLHint
        run: npx htmlhint "**/*.html"
