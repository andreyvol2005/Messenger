name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Backend: Lint + Format (Ruff) ──────────────────────────────────────
  backend-lint:
    name: "Backend · Ruff (lint + format)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install "ruff==0.5.0"

      - name: Lint
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format --check .

  # ── 2. Backend: Type Check (Mypy) — advisory ──────────────────────────────
  backend-typecheck:
    name: "Backend · Mypy (advisory)"
    runs-on: ubuntu-24.04
    # Non-blocking: existing codebase has many untyped functions.
    # Remove continue-on-error once type annotations are added incrementally.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps + Mypy
        run: |
          pip install -r requirements.txt
          pip install "mypy==1.11.0"

      - name: Mypy
        run: mypy .

  # ── 3. Backend: Tests (Pytest + Postgres) ─────────────────────────────────
  backend-test:
    name: "Backend · Pytest"
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: messenger_test
          POSTGRES_USER: messenger_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_NAME: messenger_test
      DB_USER: messenger_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
      SECRET_KEY: "ci-only-test-secret-not-for-production"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps + test tools
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Apply migrations
        # Run from repo root so migrate.py can locate migrations/ and init.sql;
        # PYTHONPATH lets it import backend modules (database.py, models.py …)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python backend/migrate.py

      - name: Run tests
        working-directory: backend
        run: pytest -v --tb=short

  # ── 4. Backend: Dependency Security Audit — advisory ──────────────────────
  backend-audit:
    name: "Backend · pip-audit (advisory)"
    runs-on: ubuntu-24.04
    # Non-blocking until requirements.txt pins exact versions.
    # Remove continue-on-error after pinning with `pip freeze`.
    continue-on-error: true
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run pip-audit
        run: |
          pip install "pip-audit==2.7.3"
          pip-audit -r requirements.txt

  # ── 5. Frontend: Lint (ESLint + Stylelint + HTMLHint) ─────────────────────
  frontend-lint:
    name: "Frontend · ESLint + Stylelint + HTMLHint"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ hashFiles('frontend/package.json') }}
          restore-keys: node-modules-

      - name: Install dev deps
        run: npm install

      - name: ESLint
        run: npx eslint .

      - name: Stylelint
        run: npx stylelint "**/*.css" --allow-empty-input

      - name: HTMLHint
        run: npx htmlhint "**/*.html"
