<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill:#1f2937; }
    .subtitle { font-size: 14px; font-weight: 600; fill:#374151; }
    .box { fill:#ffffff; stroke:#1f2937; stroke-width:2; rx:8; ry:8; }
    .box-dark { fill:#111827; stroke:#1f2937; stroke-width:2; rx:8; ry:8; }
    .box-text { font-size: 13px; font-weight: 600; fill:#1f2937; text-anchor: middle; }
    .box-text-dark { font-size: 13px; font-weight: 600; fill:#ffffff; text-anchor: middle; }
    .box-desc { font-size: 11px; fill:#6b7280; text-anchor: middle; }
    .box-desc-dark { font-size: 11px; fill:#9ca3af; text-anchor: middle; }
    .line { stroke:#4b5563; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .label { font-size: 11px; fill:#6b7280; text-anchor: middle; }
  </style>

  <!-- Заголовок -->
  <text x="460" y="34" class="title" text-anchor="middle">Workflow приложения Messenger</text>

  <!-- ===== Верхняя строка: работа приложения ===== -->
  <text x="460" y="66" class="subtitle" text-anchor="middle">Работа приложения (клиент ↔ бэкенд ↔ база)</text>

  <!-- Клиент -->
  <rect x="60" y="90" width="220" height="130" class="box"/>
  <text x="170" y="128" class="box-text">Клиент (браузер)</text>
  <text x="170" y="148" class="box-desc">десктоп + мобильная версия</text>
  <text x="170" y="172" class="box-desc">ES-модули, без фреймворков</text>
  <text x="170" y="196" class="box-desc">localStorage → сессия</text>

  <!-- Бэкенд -->
  <rect x="350" y="90" width="220" height="130" class="box"/>
  <text x="460" y="128" class="box-text">Бэкенд (FastAPI)</text>
  <text x="460" y="148" class="box-desc">REST API + WebSocket</text>
  <text x="460" y="172" class="box-desc">JWT + bcrypt, SQLAlchemy</text>
  <text x="460" y="196" class="box-desc">статусы: отправлено → доставлено → прочитано</text>

  <!-- База -->
  <rect x="640" y="90" width="220" height="130" class="box"/>
  <text x="750" y="128" class="box-text">PostgreSQL 16</text>
  <text x="750" y="148" class="box-desc">пользователи, чаты,</text>
  <text x="750" y="168" class="box-desc">сообщения, вложения,</text>
  <text x="750" y="188" class="box-desc">миграции (init.sql + migrations/)</text>

  <!-- Стрелки верхней строки -->
  <line x1="280" y1="155" x2="350" y2="155" class="line"/>
  <text x="315" y="148" class="label">HTTP API / WebSocket</text>
  <line x1="570" y1="155" x2="640" y2="155" class="line"/>
  <text x="605" y="148" class="label">SQL</text>
  <line x1="640" y1="205" x2="570" y2="205" class="line"/>
  <text x="605" y="212" class="label">WebSocket: новые сообщения + статусы</text>

  <!-- ===== Нижняя строка: CI/CD деплой ===== -->
  <text x="460" y="300" class="subtitle" text-anchor="middle">CI/CD деплой (push в main → сервер)</text>

  <!-- Push -->
  <rect x="60" y="325" width="200" height="90" class="box-dark"/>
  <text x="160" y="358" class="box-text-dark">Push в main</text>
  <text x="160" y="378" class="box-desc-dark">GitHub → инициирует деплой</text>

  <!-- GitHub Actions -->
  <rect x="330" y="325" width="260" height="130" class="box-dark"/>
  <text x="460" y="358" class="box-text-dark">GitHub Actions</text>
  <text x="460" y="378" class="box-desc-dark">бэкап базы</text>
  <text x="460" y="396" class="box-desc-dark">применение миграций (транзакция)</text>
  <text x="460" y="414" class="box-desc-dark">перезапуск messenger.service</text>
  <text x="460" y="432" class="box-desc-dark">проверка /api/health + вход с неверным паролем</text>

  <!-- Сервер -->
  <rect x="660" y="325" width="200" height="90" class="box-dark"/>
  <text x="760" y="358" class="box-text-dark">Сервер (systemd)</text>
  <text x="760" y="378" class="box-desc-dark">messenger.service, порт 8000</text>

  <!-- Стрелки нижней строки -->
  <line x1="260" y1="370" x2="330" y2="370" class="line"/>
  <line x1="590" y1="390" x2="660" y2="390" class="line"/>
  <line x1="760" y1="370" x2="760" y2="240" class="line"/>
  <line x1="760" y2="240" x2="460" y2="240" class="line"/>
  <text x="755" y="300" class="label" text-anchor="end">обновлённое приложение</text>

  <!-- Подпись -->
  <text x="460" y="590" class="label" text-anchor="middle">Схема на основе структуры проекта: backend/, frontend/, migrations/, init.sql, скрипты deploy.</text>
</svg>
