<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Чаты — Messenger</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/mobile/style.css">
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <h1 class="m-title">Чаты</h1>
            <div class="m-header-actions">
                <button id="logout-btn" class="m-icon-btn" title="Выйти">⎋</button>
            </div>
        </header>

        <form id="new-chat-form" class="m-search-form" role="search">
            <div class="m-search-field">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input type="text" id="new-chat-username" placeholder="Поиск"
                       aria-label="Поиск по имени пользователя" autocomplete="off">
            </div>
        </form>
        <ul id="user-search-results" class="user-search-results hidden"></ul>
        <p id="new-chat-error" class="error hidden m-new-chat-error"></p>

        <ul id="chat-list" class="m-chat-list"></ul>
    </div>

    <script type="module" src="/mobile/chats.js"></script>
</body>
</html>
