<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Чат — Messenger</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/mobile/style.css">
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <button id="back-btn" class="m-back-btn" title="Назад">‹</button>
            <h1 id="chat-title" class="m-title m-title-chat">Чат</h1>
        </header>

        <div id="messages" class="m-messages"></div>

        <form id="message-form" class="m-composer">
            <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
            <button type="submit" class="m-send-btn" aria-label="Отправить" title="Отправить">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 2 11 13"/>
                    <path d="M22 2 15 22 11 13 2 9 22 2z"/>
                </svg>
            </button>
        </form>
    </div>

    <script src="/shared/common.js"></script>
    <script src="/mobile/chat.js"></script>
</body>
</html>
