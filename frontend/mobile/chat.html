<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Чат — Messenger</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/mobile/style.css">
</head>
<body>
    <div class="m-page">
        <header class="m-header">
            <button id="back-btn" class="m-back-btn" title="Назад">‹</button>
            <div id="chat-avatar" class="m-header-avatar hidden">?</div>
            <div class="m-title-wrap">
                <h1 id="chat-title" class="m-title m-title-chat">Чат</h1>
                <div id="chat-status" class="m-chat-status hidden"
                     aria-live="polite"></div>
            </div>
            <button type="button" id="chat-info-btn" class="m-icon-btn hidden"
                    title="Профиль собеседника" aria-label="Информация о собеседнике">i</button>
        </header>

        <div id="chat-contact-banner" class="contact-suggestion hidden">
            <div class="contact-suggestion-text">
                <span>Этот пользователь не в контактах.</span>
                <span id="chat-contact-banner-error"
                      class="contact-suggestion-error hidden"></span>
            </div>
            <button type="button" id="chat-contact-banner-add"
                    class="contact-suggestion-add">Добавить контакт</button>
            <button type="button" id="chat-contact-banner-close"
                    class="contact-suggestion-close"
                    aria-label="Скрыть" title="Скрыть">×</button>
        </div>

        <div id="messages" class="m-messages"></div>

        <form id="message-form" class="m-composer">
            <button type="button" id="attach-btn" class="m-attach-btn"
                    title="Прикрепить изображение"
                    aria-label="Прикрепить изображение">📎</button>
            <input type="file" id="image-input" accept="image/*" hidden>
            <textarea id="message-input" rows="1" placeholder="Введите сообщение..."></textarea>
            <button type="submit" class="m-send-btn" aria-label="Отправить" title="Отправить">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 2 11 13"/>
                    <path d="M22 2 15 22 11 13 2 9 22 2z"/>
                </svg>
            </button>
        </form>
    </div>

    <!-- Полноэкранный профиль собеседника: поверх переписки, закрывается крестиком или кликом мимо -->
    <div id="peer-info-modal" class="m-peer-info" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="m-peer-info-backdrop"></div>
        <div class="m-peer-info-content">
            <button type="button" id="peer-info-close" class="m-peer-info-close"
                    aria-label="Закрыть" title="Закрыть">×</button>
            <div id="peer-info-avatar" class="avatar avatar-xl">?</div>
            <h1 id="peer-info-name" class="m-peer-info-name"></h1>
            <p id="peer-info-username" class="m-peer-info-username"></p>
            <p id="peer-info-bio" class="m-peer-info-field"></p>
            <p id="peer-info-birth" class="m-peer-info-field"></p>
        </div>
    </div>

    <!-- Информация о группе: участники, название и аватар -->
    <div id="group-info" class="m-peer-info m-group-info" aria-hidden="true"
         role="dialog" aria-modal="true">
        <div id="group-info-backdrop" class="m-peer-info-backdrop"></div>
        <div class="m-peer-info-content">
            <button type="button" id="group-info-close" class="m-peer-info-close"
                    aria-label="Закрыть" title="Закрыть">×</button>
            <div id="group-info-avatar" class="avatar avatar-xl">?</div>
            <button type="button" id="group-avatar-btn" class="m-group-avatar-btn">
                Сменить фото
            </button>
            <input type="file" id="group-avatar-input" accept="image/*" hidden>
            <h1 id="group-info-name" class="m-peer-info-name"></h1>
            <p id="group-info-count" class="m-peer-info-username"></p>

            <label class="m-field">
                <span class="m-field-label">Название группы</span>
                <div class="m-group-name-row">
                    <input type="text" id="group-name-input" maxlength="50"
                           placeholder="Название группы">
                    <button type="button" id="group-name-save">Сохранить</button>
                </div>
            </label>

            <p id="group-info-error" class="error hidden"></p>

            <h2 class="m-group-section-title">Участники</h2>
            <ul id="group-members-list" class="m-group-members-list"></ul>

            <h2 class="m-group-section-title">Добавить участника</h2>
            <input type="text" id="group-add-search" class="m-group-add-search"
                   placeholder="Имя или @username" autocomplete="off"
                   aria-label="Поиск пользователя для добавления в группу">
            <ul id="group-add-results"
                class="user-search-results m-group-add-results hidden"></ul>
        </div>
    </div>

    <script type="module" src="/mobile/chat.js"></script>
</body>
</html>
