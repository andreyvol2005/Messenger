<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чаты — Messenger</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/desktop/css/layout.css">
    <link rel="stylesheet" href="/desktop/css/profile.css">
    <link rel="stylesheet" href="/desktop/css/sidebar.css">
    <link rel="stylesheet" href="/desktop/css/chat.css">
    <link rel="stylesheet" href="/desktop/css/contacts.css">
</head>
<body>
    <div class="chat-layout">
        <!-- Узкая колонка слева: из неё открывается выдвижное меню -->
        <aside class="app-rail">
            <button type="button" id="menu-btn" class="rail-btn" title="Меню"
                    aria-label="Открыть меню" aria-expanded="false" aria-controls="side-menu">
                <span></span><span></span><span></span>
            </button>
        </aside>

        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <form id="new-chat-form" class="sidebar-search" role="search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.5-3.5"></path>
                    </svg>
                    <input type="text" id="new-chat-username" placeholder="Поиск"
                           aria-label="Поиск по имени пользователя" autocomplete="off">
                </form>
            </div>
            <ul id="user-search-results" class="user-search-results hidden"></ul>
            <p id="new-chat-error" class="error hidden new-chat-error"></p>
            <ul id="chat-list" class="chat-list"></ul>
        </aside>
        <div id="sidebar-resizer" class="resizer" role="separator"
            aria-orientation="vertical" title="Потяните, чтобы изменить ширину"></div>
        <main class="chat-main">
            <div id="chat-placeholder" class="chat-placeholder">
                Выберите чат, чтобы начать общение
            </div>
            <div id="chat-window" class="chat-window hidden">
                <div class="chat-header">
                    <h3 id="chat-title"></h3>
                </div>
                <div id="chat-contact-banner" class="contact-suggestion hidden">
                    <div class="contact-suggestion-text">
                        <span>Этот пользователь не в контактах.</span>
                        <span id="chat-contact-banner-error"
                              class="contact-suggestion-error hidden"></span>
                    </div>
                    <button type="button" id="chat-contact-banner-add"
                            class="contact-suggestion-add">Добавить контакт</button>
                    <button type="button" id="chat-contact-banner-close"
                            class="contact-suggestion-close"
                            aria-label="Скрыть" title="Скрыть">×</button>
                </div>
                <div id="messages" class="messages"></div>
                <form id="message-form" class="message-form">
                <input type="text" id="message-input" placeholder="Введите сообщение...">
                <button type="submit" title="Отправить" aria-label="Отправить">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22 2 11 13"/>
                        <path d="M22 2 15 22 11 13 2 9 22 2z"/>
                    </svg>
                </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Затемнение основного экрана, пока открыто меню -->
    <div id="menu-backdrop" class="overlay" aria-hidden="true"></div>

    <!-- Выдвижное меню -->
    <aside id="side-menu" class="side-menu" aria-hidden="true" aria-label="Главное меню">
        <div class="side-menu-user">
            <div id="menu-avatar" class="avatar avatar-lg">?</div>
            <div class="side-menu-user-text">
                <div id="menu-nickname" class="side-menu-name"></div>
                <div id="menu-username" class="side-menu-sub"></div>
            </div>
        </div>

        <nav class="side-menu-nav">
            <button type="button" id="menu-profile" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4 3.6-6.2 8-6.2s8 2.2 8 6.2"/>
                </svg>
                <span>Профиль</span>
            </button>
            <button type="button" id="menu-contacts" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="9" cy="8" r="3.4"/>
                    <path d="M2.6 20c0-3.4 2.9-5.3 6.4-5.3s6.4 1.9 6.4 5.3"/>
                    <path d="M15.9 5.2a3.4 3.4 0 0 1 0 6.5"/>
                    <path d="M17.9 14.9c2.2.6 3.5 2.2 3.5 4.5"/>
                </svg>
                <span>Контакты</span>
            </button>
        </nav>
    </aside>

    <!-- Диалог профиля: открывается поверх затемнённого интерфейса -->
    <div id="profile-modal" class="modal" aria-hidden="true">
        <div id="profile-backdrop" class="modal-backdrop"></div>

        <div class="profile-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-name">
            <div id="profile-avatar" class="avatar avatar-xl">?</div>
            <h2 id="profile-name" class="profile-name"></h2>
            <p id="profile-since" class="profile-since"></p>

            <label class="field">
                <span class="field-label">Имя пользователя</span>
                <div class="input-with-prefix">
                    <span class="input-prefix">@</span>
                    <input type="text" id="profile-username" maxlength="30"
                           autocomplete="username" placeholder="Имя пользователя">
                </div>
            </label>

            <label class="field">
                <span class="field-label">Имя</span>
                <input type="text" id="profile-nickname" maxlength="30"
                       autocomplete="nickname" placeholder="Имя">
            </label>

            <label class="field">
                <span class="field-label">Дата рождения</span>
                <input type="date" id="profile-birth">
            </label>

            <label class="field">
                <span class="field-label">О себе</span>
                <textarea id="profile-bio" rows="3" maxlength="150"
                          placeholder="Пара слов о себе"></textarea>
            </label>

            <p id="profile-error" class="error hidden"></p>

            <div class="profile-actions">
                <button type="button" id="profile-logout" class="btn-ghost"
                        title="Выйти из аккаунта">Выйти</button>
                <button type="button" id="profile-close" class="btn-ghost">Закрыть</button>
                <button type="button" id="profile-save">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Экран контактов: список сохранённых контактов поверх затемнённого интерфейса -->
    <div id="contacts-modal" class="modal" aria-hidden="true">
        <div id="contacts-backdrop" class="modal-backdrop"></div>

        <div class="contacts-dialog" role="dialog" aria-modal="true" aria-labelledby="contacts-title">
            <div class="contacts-header">
                <h2 id="contacts-title" class="contacts-title">Контакты</h2>
                <button type="button" id="contacts-close" class="contacts-close"
                        aria-label="Закрыть контакты" title="Закрыть">×</button>
            </div>

            <button type="button" id="contacts-add-toggle" class="contacts-add-toggle">
                <span class="contacts-add-plus">＋</span>
                <span>Добавить контакт</span>
            </button>

            <form id="contact-add-form" class="contact-add-form hidden">
                <div class="contact-add-row">
                    <input type="text" id="contact-search" maxlength="30"
                           placeholder="Имя пользователя (без @)"
                           aria-label="Имя пользователя для добавления в контакты"
                           autocomplete="off">
                    <button type="submit">Добавить</button>
                </div>
                <ul id="contact-search-results"
                    class="user-search-results contact-search-results hidden"></ul>
            </form>

            <p id="contacts-error" class="error hidden contacts-error"></p>
            <ul id="contacts-list" class="contacts-list"></ul>
        </div>
    </div>

    <script type="module" src="/desktop/app.js"></script>
</body>
</html>
