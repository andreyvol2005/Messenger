<div class="auth-container">
    <h1 class="auth-title">Messenger</h1>

    <div class="auth-tabs">
        <button id="tab-login" class="tab active">Вход</button>
        <button id="tab-register" class="tab">Регистрация</button>
    </div>

    <form id="auth-form" class="auth-form">
        <input type="text" id="username" placeholder="Логин" autocomplete="username" required>
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
        <input type="text" id="nickname" placeholder="Никнейм" class="hidden">
        <button type="submit" id="auth-submit">Войти</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
</div>
