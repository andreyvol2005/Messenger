<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Messenger</title>
    <link rel="stylesheet" href="/shared/base.css">
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">Messenger</h1>

        <div class="auth-tabs">
            <button id="tab-login" class="tab active">Вход</button>
            <button id="tab-register" class="tab">Регистрация</button>
        </div>

        <form id="auth-form" class="auth-form">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit" id="auth-submit">Войти</button>
        </form>

        <p id="auth-hint" class="auth-hint">Вход по username, без символа @</p>
        <p id="auth-error" class="error hidden"></p>
    </div>

    <script src="/shared/common.js"></script>
    <script>LoginPage.init();</script>
</body>
</html>
