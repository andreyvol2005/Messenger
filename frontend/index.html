<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Messenger — Test Frontend</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; padding: 20px; max-width: 600px; margin: auto; }
        input, button { padding: 8px; margin: 4px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #eee; }
        button { cursor: pointer; background: #007bff; border: none; }
        button:hover { background: #0056b3; }
        #chat { border: 1px solid #444; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; border-radius: 6px; }
        .msg { margin: 4px 0; padding: 6px; border-radius: 6px; background: #333; }
        .my { background: #005c4b; text-align: right; }
        .hidden { display: none; }
        h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>🔧 Messenger Dev</h1>

    <div id="auth">
        <h3>Регистрация / Вход</h3>
        <input id="username" placeholder="username" />
        <input id="password" type="password" placeholder="password" />
        <button onclick="register()">Регистрация</button>
        <button onclick="login()">Войти</button>
    </div>

    <div id="app" class="hidden">
        <h3>Вы вошли как <span id="whoami"></span></h3>
        <p>Тестовый чат (chat_id = 1). Отправьте сообщение:</p>
        <div id="chat"></div>
        <input id="msgText" placeholder="Текст сообщения..." style="width: 70%;" />
        <button onclick="sendMsg()">Отправить</button>
        <button onclick="logout()">Выйти</button>
    </div>

    <script>
        const API = ""; // пусто = тот же хост, что и фронт
        let token = null;
        let userId = null;
        let ws = null;

        async function register() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch(API + "/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) alert("Зарегистрирован! Теперь войдите.");
            else alert("Ошибка: " + (data.detail || JSON.stringify(data)));
        }

        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch(API + "/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) return alert("Ошибка: " + (data.detail || "неизвестно"));

            token = data.access_token;
            userId = data.user_id;
            document.getElementById("whoami").textContent = data.nickname;
            document.getElementById("auth").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            connectWS();
        }

        function connectWS() {
            const proto = location.protocol === "https:" ? "wss" : "ws";
            ws = new WebSocket(`${proto}://${location.host}/ws/${userId}`);
            ws.onmessage = (e) => {
                const m = JSON.parse(e.data);
                const div = document.createElement("div");
                div.className = "msg" + (m.sender_id === userId ? " my" : "");
                div.textContent = `[${m.sender_id}]: ${m.text}`;
                document.getElementById("chat").appendChild(div);
                document.getElementById("chat").scrollTop = 999999;
            };
            ws.onopen = () => console.log("WS connected");
            ws.onclose = () => console.log("WS closed");
        }

        function sendMsg() {
            const text = document.getElementById("msgText").value;
            if (!text || !ws) return;
            ws.send(JSON.stringify({ chat_id: 1, text: text, reply_to_id: null }));
            document.getElementById("msgText").value = "";
        }

        function logout() {
            if (ws) ws.close();
            location.reload();
        }
    </script>
</body>
</html>
